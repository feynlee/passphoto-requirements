name: Validate

# Every pull request and every change on main must pass validation. On main, the manifest the app reads
# is regenerated if needed, and the CDN copy is refreshed.
on:
  pull_request:
  push:
    branches: [main]
    paths: ["requirements/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate
        run: python3 tools/validate.py
      - name: Refresh the manifest and CDN
        if: github.event_name != 'pull_request'
        run: |
          python3 tools/validate.py --write-manifest
          if ! git diff --quiet manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add manifest.json
            git commit -m "Update manifest"
            git push
          fi
          curl -fsS "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/manifest.json" || true
